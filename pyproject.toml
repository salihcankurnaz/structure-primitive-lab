[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structure-primitive-lab"
version = "0.1.0"
description = "Research harness for structure-aware computation primitives."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["splab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
